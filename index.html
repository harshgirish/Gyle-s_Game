<style>html,body{margin:0;height:100%;overflow:hidden;background:oklch(0.86 0.02 190)}canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;outline:none}</style>
</head><body><canvas id="game" tabindex="0" aria-label="Gyles's World, a driving game"></canvas>
<script>
/* Gyles's World: a 2D top-down gift game. Vanilla canvas, no dependencies. */
function startGame(canvas, assets = {}) {
  const ctx = canvas.getContext("2d");
  const FD = '"Montserrat", "Helvetica Neue", Arial, sans-serif';
  const FM = '"DM Mono", ui-monospace, Menlo, monospace';
  const FE = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
  const KEY = "gyles-world-v2";
  const photo = new Image();
  let photoOk = false;
  if (assets.photo) { photo.onload = () => { photoOk = true; }; photo.src = assets.photo; }

  // ---------------------------------------------------------------- utils
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  const TAU = Math.PI * 2;
  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const R = rng(99);
  function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
  function circ(x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = col; ctx.fill(); }
  function ell(x, y, rx, ry, col) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fillStyle = col; ctx.fill(); }
  function txt(s, x, y, size, col, align = "left", font = FD, weight = 700, base = "alphabetic") {
    ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
  }
  function spaced(s, x, y, size, col, sp, align = "center", font = FD, weight = 800) {
    ctx.font = `${weight} ${size}px ${font}`;
    const chars = [...s]; const ws = chars.map((c) => ctx.measureText(c).width);
    const total = ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
    let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
    ctx.fillStyle = col; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i] + sp; });
  }
  function wrap(s, x, y, maxW, size, lh, col, align = "left", font = FD, weight = 500) {
    ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
    const words = s.split(" "); let line = ""; let yy = y;
    for (const w of words) {
      const t = line ? line + " " + w : w;
      if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; } else line = t;
    }
    if (line) ctx.fillText(line, x, yy);
    return yy;
  }
  function emo(e, x, y, size) { ctx.font = `${size}px ${FE}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "oklch(0 0 0)"; ctx.fillText(e, x, y); }
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0;
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  }
  const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  // ---------------------------------------------------------------- palette
  const C = {
    ink: "oklch(0.25 0.03 255)", cream: "oklch(0.97 0.015 90)", paper: "oklch(0.95 0.02 85)",
    lumon: "oklch(0.86 0.02 190)", carpet: "oklch(0.64 0.045 185)", desk: "oklch(0.94 0.01 190)", lumonInk: "oklch(0.32 0.04 205)", glow: "oklch(0.80 0.10 170)",
    grass: "oklch(0.74 0.12 135)", road: "oklch(0.37 0.02 265)", roadEdge: "oklch(0.30 0.02 265)", line: "oklch(0.90 0.15 95)",
    car: "oklch(0.60 0.21 30)", carDark: "oklch(0.44 0.16 28)", glass: "oklch(0.36 0.05 240)",
    stamp: "oklch(0.55 0.20 25)", gold: "oklch(0.82 0.15 85)", lav: "oklch(0.72 0.12 300)", sea: "oklch(0.66 0.11 225)",
    shadow: "oklch(0.2 0.03 260 / 0.28)", white: "oklch(0.99 0.005 90)", cally: "oklch(0.74 0.09 70)",
  };

  // ---------------------------------------------------------------- world
  const WORLD = { w: 3700, h: 2650 };
  const REG = [
    { id: "roch", name: "Rochester", x: 250, y: 250, w: 700, h: 550, g: "oklch(0.72 0.11 120)", g2: "oklch(0.66 0.13 70)" },
    { id: "vt", name: "Vermont", x: 1100, y: 150, w: 750, h: 600, g: "oklch(0.96 0.012 230)", g2: "oklch(0.90 0.03 230)", surf: "snow" },
    { id: "mtl", name: "Montréal", x: 1950, y: 150, w: 720, h: 600, g: "oklch(0.91 0.02 250)", g2: "oklch(0.84 0.03 250)", surf: "snow" },
    { id: "eu", name: "Wishlist Coast", x: 2780, y: 100, w: 780, h: 640, g: "oklch(0.68 0.11 230)", g2: "oklch(0.62 0.11 232)" },
    { id: "bos", name: "Boston", x: 250, y: 950, w: 720, h: 650, g: "oklch(0.70 0.06 45)", g2: "oklch(0.64 0.07 40)" },
    { id: "woods", name: "The Woods", x: 1100, y: 950, w: 780, h: 650, g: "oklch(0.42 0.07 150)", g2: "oklch(0.36 0.06 150)" },
    { id: "co", name: "Colorado", x: 2130, y: 950, w: 740, h: 650, g: "oklch(0.68 0.12 50)", g2: "oklch(0.60 0.13 40)" },
    { id: "ind", name: "India", x: 3050, y: 950, w: 500, h: 1500, g: "oklch(0.82 0.14 75)", g2: "oklch(0.76 0.16 60)" },
    { id: "cabo", name: "Cabo", x: 250, y: 1780, w: 720, h: 680, g: "oklch(0.89 0.08 85)", g2: "oklch(0.84 0.09 80)", surf: "sand" },
    { id: "cr", name: "Costa Rica", x: 1100, y: 1780, w: 780, h: 680, g: "oklch(0.58 0.15 150)", g2: "oklch(0.52 0.14 155)" },
    { id: "fest", name: "The Festival", x: 2130, y: 1780, w: 740, h: 680, g: "oklch(0.30 0.08 300)", g2: "oklch(0.36 0.12 320)" },
  ];
  const WATER = [
    { x: 250, y: 950, w: 110, h: 650 },
    { x: 250, y: 2340, w: 720, h: 120 },
    { x: 2780, y: 100, w: 780, h: 640 },
  ];
  const ROADS = [
    [150, 860, 3600, 860], [150, 1690, 2960, 1690], [150, 2530, 2960, 2530],
    [1035, 120, 1035, 2530], [1915, 120, 1915, 2530], [2960, 860, 2960, 2530],
    [600, 525, 600, 860], [1475, 450, 1475, 860], [2310, 450, 2310, 860], [3170, 860, 3170, 430],
    [610, 860, 610, 1690], [1035, 1275, 1915, 1275], [1915, 1275, 2960, 1275], [2960, 1450, 3300, 1450],
    [610, 1690, 610, 2120], [1490, 1690, 1490, 2120], [2500, 1690, 2500, 2120],
  ];
  const regionAt = (x, y) => REG.find((g) => x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + g.h) || null;
  const nearRoad = (x, y, d) => ROADS.some((r) => segDist(x, y, r[0], r[1], r[2], r[3]) < d);
  const inWater = (x, y) => WATER.some((w) => x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h);

  const STOPS = [
    { id: "obama", name: "Dinner with Obama", short: "Dinner", e: "🍽️", x: 610, y: 1275, col: "oklch(0.50 0.12 255)", make: () => makeObama() },
    { id: "band", name: "Band Room", short: "Band", e: "🎷", x: 600, y: 525, col: "oklch(0.62 0.17 45)", make: () => makeBand() },
    { id: "ski", name: "Slalom Run", short: "Ski", e: "⛷️", x: 1475, y: 450, col: "oklch(0.55 0.14 240)", make: () => makeSki() },
    { id: "cinema", name: "Cinéma Quiz", short: "Cinema", e: "🎬", x: 2310, y: 450, col: "oklch(0.50 0.16 20)", make: () => makeQuiz() },
    { id: "forest", name: "The Cabin", short: "Cabin", e: "🛖", x: 1490, y: 1275, col: "oklch(0.40 0.08 150)" },
    { id: "climb", name: "The Wall", short: "Climb", e: "🧗", x: 2500, y: 1275, col: "oklch(0.52 0.14 40)", need: 6, make: () => makeClimb() },
    { id: "food", name: "Wedding Buffet", short: "Buffet", e: "🍕", x: 610, y: 2120, col: "oklch(0.62 0.17 55)", make: () => makeFood() },
    { id: "safari", name: "Photo Safari", short: "Photos", e: "📸", x: 1490, y: 2120, col: "oklch(0.48 0.13 150)", make: () => makeSafari() },
    { id: "rave", name: "Main Stage", short: "Stage", e: "🎧", x: 2500, y: 2120, col: "oklch(0.58 0.22 320)" },
  ];
  const INDIA = { id: "india", name: "Gate J · India", e: "✈️", x: 3300, y: 1450, col: C.gold };
  const EUROPE = { x: 3170, y: 430 };

  const SECRETS = [
    { id: "believe", e: "🪧", n: "BELIEVE sign", x: 450, y: 1510, line: "Taped slightly crooked. Perfect." },
    { id: "biscuits", e: "🍪", n: "Biscuits", x: 870, y: 1530, line: "Biscuits with the boss." },
    { id: "goldfish", e: "🐟", n: "Goldfish", x: 330, y: 330, line: "Be a goldfish. Nice calf ink, by the way." },
    { id: "latte", e: "💜", n: "Lavender latte", x: 1200, y: 690, line: "Lavender latte. Day-person fuel." },
    { id: "iced", e: "🧊", n: "Black iced coffee", x: 2790, y: 1070, line: "Black iced coffee. No notes." },
    { id: "brownie", e: "🍫", n: "Brownie", x: 390, y: 1880, line: "Sweet tooth detected." },
    { id: "sushi", e: "🍣", n: "Sushi", x: 2570, y: 660, line: "Sushi in Montréal. Why not." },
    { id: "rosebud", e: "🌹", n: "Rosebud Motel", x: 2070, y: 300, line: "Simply the best." },
    { id: "thatsall", e: "🕳️", n: "Cartoon hole", x: 2250, y: 1530, line: "That's all, folks? Not yet." },
    { id: "widow", e: "🕷️", n: "Black Widow", x: 1250, y: 1080, line: "Red hourglass. Superhero adjacent." },
    { id: "camera", e: "📷", n: "Vintage camera", x: 1290, y: 2390, line: "Shoot everything." },
    { id: "cake", e: "🎂", n: "Sweet 30 cake", x: 2290, y: 2390, line: "Sweet 30. Make a wish." },
  ];

  // decorations
  const DECO = [], PATCH = [];
  (function gen() {
    const r = rng(2026);
    const types = {
      roch: [["tree", 26], ["house", 9]], vt: [["pine", 46], ["cabin", 4]], mtl: [["building", 18], ["pine", 10]],
      bos: [["brick", 18], ["tree", 12]], woods: [["pine", 80]], co: [["mountain", 10], ["rock", 14], ["pine", 8]],
      ind: [["palm", 18], ["temple", 4], ["flowers", 18]], cabo: [["palm", 16], ["umbrella", 10]],
      cr: [["jungle", 40], ["palm", 10]], fest: [["tent", 8], ["lights", 14]],
    };
    const nearSpecial = (x, y) => STOPS.some((s) => dist(x, y, s.x, s.y) < 140) || dist(x, y, INDIA.x, INDIA.y) < 160 || SECRETS.some((s) => dist(x, y, s.x, s.y) < 50) || dist(x, y, 800, 1450) < 110;
    for (const g of REG) {
      for (let i = 0; i < 26; i++) PATCH.push({ x: g.x + r() * g.w, y: g.y + r() * g.h, rx: 30 + r() * 80, ry: 20 + r() * 50, col: g.g2, reg: g });
      const list = types[g.id]; if (!list) continue;
      for (const [type, n] of list) for (let i = 0; i < n; i++) for (let k = 0; k < 14; k++) {
        const x = g.x + 40 + r() * (g.w - 80), y = g.y + 40 + r() * (g.h - 80);
        if (nearRoad(x, y, type === "mountain" ? 120 : 64) || nearSpecial(x, y) || inWater(x, y)) continue;
        DECO.push({ type, x, y, s: 0.8 + r() * 0.5, h: r(), reg: g.id }); break;
      }
    }
    for (let i = 0; i < 160; i++) {
      const x = r() * WORLD.w, y = r() * WORLD.h;
      if (regionAt(x, y) || nearRoad(x, y, 60)) continue;
      DECO.push({ type: r() < 0.7 ? "tree" : "bush", x, y, s: 0.7 + r() * 0.4, h: r(), reg: "" });
    }
    DECO.push({ type: "lumon", x: 800, y: 1450, s: 1, h: 0, reg: "bos" });
    DECO.sort((a, b) => a.y - b.y);
  })();

  const PROPS = [];
  function addProp(type, x, y) { PROPS.push({ type, x, y, vx: 0, vy: 0, a: R() * TAU, va: 0, r: type === "pin" ? 8 : 11 }); }
  for (let i = 0; i < 7; i++) addProp("cone", 1200 + i * 46, 845 + (i % 2) * 30);
  for (let i = 0; i < 6; i++) addProp("cone", 1915 - 14 + (i % 2) * 28, 1450 + i * 44);
  for (let i = 0; i < 5; i++) addProp("pizza", 700 + i * 22, 1180 + (i % 2) * 18);
  [[0, 0], [-12, 18], [12, 18], [-24, 36], [0, 36], [24, 36]].forEach(([dx, dy]) => addProp("pin", 600 + dx, 700 + dy));
  for (let i = 0; i < 6; i++) addProp("cone", 2600 + i * 50, 1690 + (i % 2 ? 22 : -22));
  const BOOSTS = [[1700, 860, 0], [2620, 860, 0], [1035, 1500, Math.PI / 2], [1250, 1690, 0], [2300, 1690, Math.PI], [2960, 1100, Math.PI / 2], [1915, 2200, -Math.PI / 2], [800, 2530, 0]].map(([x, y, a]) => ({ x, y, a }));
  const RAMPS = [[1915, 620, -Math.PI / 2], [1700, 1690, 0], [2960, 2050, Math.PI / 2], [1035, 400, -Math.PI / 2]].map(([x, y, a]) => ({ x, y, a }));

  // ---------------------------------------------------------------- persistent state
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  const saved = load();
  const stamps = new Set(saved?.stamps || []);
  const secrets = new Set(saved?.secrets || []);
  let gallery = saved?.gallery || [];
  let endingSeen = !!saved?.endingSeen;
  function persist() { try { localStorage.setItem(KEY, JSON.stringify({ stamps: [...stamps], secrets: [...secrets], gallery, endingSeen })); } catch (e) { /* storage blocked */ } }
  function resetSave() { stamps.clear(); secrets.clear(); gallery = []; endingSeen = false; persist(); }

  // ---------------------------------------------------------------- canvas sizing
  let W = 0, H = 0, DPR = 1;
  const dark = document.createElement("canvas"); const dctx = dark.getContext("2d");
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect(); W = Math.max(320, r.width); H = Math.max(320, r.height);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    dark.width = canvas.width; dark.height = canvas.height;
  }
  const ro = new ResizeObserver(resize); ro.observe(canvas); resize();

  // ---------------------------------------------------------------- input
  const keys = new Set(), pressed = new Set(), vkeys = new Set();
  const isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const mouse = { x: 0, y: 0, down: false, moved: -10 };
  const clicks = [];
  const ptrs = new Map();
  const down = (...ks) => ks.some((k) => keys.has(k) || vkeys.has(k));
  const hit = (...ks) => ks.some((k) => pressed.has(k));
  function kd(e) {
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
    if (!keys.has(k)) pressed.add(k); keys.add(k); initAudio();
  }
  function ku(e) { keys.delete(e.key.toLowerCase()); }
  function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function pd(e) {
    initAudio(); canvas.focus?.();
    const p = pos(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true; mouse.moved = T;
    const b = (mode === "world" || mode === "office") ? touchBtnAt(p) : null;
    if (b) { ptrs.set(e.pointerId, b.key); vkeys.add(b.key); pressed.add(b.key); } else clicks.push(p);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
  function pm(e) {
    const p = pos(e); mouse.x = p.x; mouse.y = p.y; mouse.moved = T;
    if (ptrs.has(e.pointerId)) {
      const b = touchBtnAt(p), old = ptrs.get(e.pointerId);
      if (!b || b.key !== old) { vkeys.delete(old); ptrs.delete(e.pointerId); if (b) { ptrs.set(e.pointerId, b.key); vkeys.add(b.key); } }
    }
  }
  function pu(e) { const k = ptrs.get(e.pointerId); if (k) { vkeys.delete(k); ptrs.delete(e.pointerId); } mouse.down = false; }
  window.addEventListener("keydown", kd); window.addEventListener("keyup", ku);
  canvas.addEventListener("pointerdown", pd); canvas.addEventListener("pointermove", pm);
  canvas.addEventListener("pointerup", pu); canvas.addEventListener("pointercancel", pu);
  const blur = () => { keys.clear(); vkeys.clear(); };
  window.addEventListener("blur", blur);

  function touchButtons() {
    if (!isTouch) return [];
    const s = Math.min(1, W / 420); const r = 38 * s + 6;
    if (mode === "office") return [
      { key: "arrowleft", x: 24 + r, y: H - 24 - r, r, l: "◀" }, { key: "arrowright", x: 24 + r * 3.3, y: H - 24 - r, r, l: "▶" },
      { key: "arrowup", x: W - 24 - r * 3.3, y: H - 24 - r, r, l: "▲" }, { key: "arrowdown", x: W - 24 - r, y: H - 24 - r, r, l: "▼" },
    ];
    return [
      { key: "arrowleft", x: 24 + r, y: H - 24 - r, r, l: "◀" }, { key: "arrowright", x: 24 + r * 3.3, y: H - 24 - r, r, l: "▶" },
      { key: "arrowup", x: W - 24 - r, y: H - 24 - r * 3.2, r, l: "GO" }, { key: "arrowdown", x: W - 24 - r, y: H - 24 - r, r, l: "◼" },
      { key: "e", x: W - 24 - r * 3.4, y: H - 24 - r, r: r * 0.85, l: "E" }, { key: " ", x: W - 24 - r * 3.4, y: H - 24 - r * 3.2, r: r * 0.7, l: "🎷" },
    ];
  }
  function touchBtnAt(p) { return touchButtons().find((b) => dist(p.x, p.y, b.x, b.y) < b.r * 1.15) || null; }

  // ---------------------------------------------------------------- audio
  let ac = null, master = null, engOsc = null, engGain = null, noiseBuf = null, muted = false, nextBeat = 0, beatN = 0;
  function initAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
      engOsc = ac.createOscillator(); engOsc.type = "sawtooth"; engOsc.frequency.value = 50;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 380;
      engGain = ac.createGain(); engGain.gain.value = 0; engOsc.connect(lp); lp.connect(engGain); engGain.connect(master); engOsc.start();
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function tone(f, dur, type = "sine", vol = 0.2, when = 0, slide = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol = 0.2, freq = 3000, when = 0) {
    if (!ac || muted || !noiseBuf) return;
    const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  function sax(f, dur = 0.35, vol = 0.18, when = 0) {
    if (!ac || muted) return;

  // Band room: three-lane note catcher
  function makeBand() {
    const r = rng(77), notes = []; let tt = 2.2;

    const names = ["Sax", "Drums", "Piano"], icons = ["🎷", "🥁", "🎹"], cols = ["oklch(0.72 0.16 70)", "oklch(0.60 0.18 25)", "oklch(0.55 0.12 260)"];
    const speed = 360; const geo = () => { const tw = Math.min(W * 0.86, 540); return { x0: W / 2 - tw / 2, lw: tw / 3, hitY: H - (isTouch ? 170 : 140) }; };

        for (const c of usableClicks()) if (c.y > 90) { const l = Math.floor((c.x - x0) / lw); if (l >= 0 && l < 3) lanes.push(l); }

  // Vermont slalom
  function makeSki() {
    const r = rng(12); let t = 0, x = 0.5, vx = 0, speed = 300, scroll = 0, passed = 0, slow = 0, endT = -1;
    const gates = [], trees = [], trail = [];
    for (let i = 0; i < 16; i++) gates.push({ y: 500 + i * 270, c: 0.22 + r() * 0.56, done: false, ok: false });
    for (let i = 0; i < 46; i++) { const y = 300 + r() * 4300, tx = r(); if (gates.some((g) => Math.abs(g.y - y) < 60 && Math.abs(g.c - tx) < 0.2)) continue; trees.push({ y, x: tx, hit: false }); }
    const total = gates[gates.length - 1].y + 200;
    const geo = () => { const fw = Math.min(W, 620); return { fx: W / 2 - fw / 2, fw, sy: H * 0.32 }; };
    return {
      update(dt) {
        t += dt; const { fx, fw } = geo();
        let target = (down("arrowright", "d") ? 1 : 0) - (down("arrowleft", "a") ? 1 : 0);

        vx = lerp(vx, target * 0.85, 1 - Math.exp(-6 * dt)); x = clamp(x + vx * dt, 0.05, 0.95);

        speed = Math.min(470, speed + 8 * dt);
        scroll += speed * dt * (slow > 0 ? 0.45 : 1);
        trail.push({ x, y: scroll }); if (trail.length > 80) trail.shift();
        for (const g of gates) if (!g.done && g.y < scroll) { g.done = true; g.ok = Math.abs(x - g.c) < 0.11; if (g.ok) { passed++; SFX.good(); } else SFX.soft(); }

        if (endT > 0 && t - endT > 0.6) finish("ski", `${passed} of 16 gates in ${t.toFixed(1)}s. Vermont powder, conquered.`);
      },
      draw() {
        ctx.fillStyle = "oklch(0.97 0.01 230)"; ctx.fillRect(0, 0, W, H);
        const { fx, fw, sy } = geo();
        ctx.fillStyle = "oklch(0.92 0.02 230)"; ctx.fillRect(0, 0, fx, H); ctx.fillRect(fx + fw, 0, W - fx - fw, H);

        ctx.strokeStyle = "oklch(0.85 0.03 230)"; ctx.lineWidth = 3; ctx.beginPath(); trail.forEach((p, i) => { const px = fx + p.x * fw, py = Y(p.y); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }); ctx.stroke();
        for (const g of gates) { const y = Y(g.y); if (y < -40 || y > H + 40) continue; const gw = 0.11 * fw, cx = fx + g.c * fw, col = g.done ? (g.ok ? "oklch(0.62 0.16 150)" : "oklch(0.7 0.02 260)") : (gates.indexOf(g) % 2 ? "oklch(0.55 0.2 25)" : "oklch(0.52 0.16 255)"); [cx - gw, cx + gw].forEach((px) => { ctx.fillStyle = C.ink; ctx.fillRect(px - 1.5, y - 26, 3, 28); ctx.beginPath(); ctx.moveTo(px, y - 26); ctx.lineTo(px + (px < cx ? -18 : 18), y - 18); ctx.lineTo(px, y - 10); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); }); }
        for (const tr of trees) { const y = Y(tr.y); if (y < -40 || y > H + 40) continue; const px = fx + tr.x * fw; ctx.beginPath(); ctx.moveTo(px - 18, y + 8); ctx.lineTo(px, y - 30); ctx.lineTo(px + 18, y + 8); ctx.closePath(); ctx.fillStyle = "oklch(0.45 0.09 160)"; ctx.fill(); }
        const px = fx + x * fw; ctx.save(); ctx.translate(px, sy); ctx.rotate(-vx * 0.5);

        ctx.restore();
        for (let i = 0; i < 50; i++) circ((i * 131 + T * 20) % W, (i * 73 + T * 90) % H, 2, "oklch(0.88 0.03 230)");
        miniFrame("Slalom · Vermont", `Steer through the flags · ${passed}/16`);
      },
    };
  }

    const OPTS = ["Ted Lasso", "Severance", "Schitt's Creek", "Looney Tunes"];
    const QS = [["“Believe.”", 0], ["“The work is mysterious and important.”", 1], ["“Ew, David!”", 2], ["“What's up, Doc?”", 3], ["“Football is life!”", 0], ["“Please enjoy each fact equally.”", 1]];
    let i = 0, pick = -1, fb = 0, score = 0, rects = [];
    return {
      update(dt) {
        if (pick >= 0) { fb += dt; if (fb > 1.1) { i++; pick = -1; fb = 0; if (i >= QS.length) finish("cinema", `${score}/${QS.length} quotes matched. Popcorn earned.`); } return; }
        let choice = -1; ["1", "2", "3", "4"].forEach((k, j) => { if (hit(k)) choice = j; });
        for (const c of usableClicks()) rects.forEach((r, j) => { if (inRect(c, r)) choice = j; });
        if (choice >= 0) { pick = choice; if (choice === QS[i][1]) { score++; SFX.good(); } else SFX.soft(); }
      },
      draw() {

        for (let k = 0; k < 6; k++) { circ(sx - 12 + (k % 2) * (sw + 24), syy + 30 + Math.floor(k / 2) * (sh / 3), 4, `oklch(0.85 0.15 90 / ${0.5 + 0.5 * Math.sin(T * 4 + k)})`); }
        if (i < QS.length) {
          txt(`Quote ${i + 1} of ${QS.length} · who said it?`, W / 2, syy + 36, 14, C.lumonInk, "center", FM, 500);
          wrap(QS[i][0], W / 2, syy + sh / 2 + 10, sw - 60, Math.min(32, W / 16), 40, C.ink, "center", FD, 800);
          const bw = (sw - 16) / 2, bh = 64, by = syy + sh + 24; rects = [];

  // Colorado climb
  function makeClimb() {
    const HOLDS = 9; let lvl = 0, p = 0, dir = 1, zc = 0.5, zw = 0.3, shown = 0, doneT = 0, slips = 0;
    const r = rng(5); const holds = Array.from({ length: HOLDS + 1 }, (_, i) => ({ x: 0.5 + (i % 2 ? 0.14 : -0.14) + (r() - 0.5) * 0.1, i }));
    const newZone = () => { zw = Math.max(0.12, 0.3 - lvl * 0.02); zc = zw / 2 + r() * (1 - zw); };
    newZone();
    return {
      update(dt) {
        shown = lerp(shown, lvl, 1 - Math.exp(-8 * dt));
        if (doneT) { doneT += dt; if (doneT > 1.6) finish("climb", `Summit, with ${slips} slip${slips === 1 ? "" : "s"}. Rock climbing just moved from “yet to do” to done.`); return; }
        p += dir * dt * (0.8 + lvl * 0.12); if (p > 1) { p = 1; dir = -1; } if (p < 0) { p = 0; dir = 1; }
        if (hit(" ", "enter", "arrowup", "w") || usableClicks().length) {
          if (Math.abs(p - zc) < zw / 2) { lvl++; tone(300 + lvl * 60, 0.15, "triangle", 0.15); newZone(); if (lvl >= HOLDS) { doneT = 0.001; SFX.chime(); } }
          else { lvl = Math.max(0, lvl - 1); slips++; shake = 10; SFX.thunk(); newZone(); }
        }
      },
      draw() {
        const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, "oklch(0.78 0.08 230)"); grad.addColorStop(1, "oklch(0.88 0.06 80)"); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
        const ww = Math.min(W * 0.7, 420), wx = W / 2 - ww / 2, step = 110, base = H - 150;
        const camY = shown * step;
        ctx.save(); ctx.translate(0, camY + (R() - 0.5) * shake);
        ctx.fillStyle = "oklch(0.55 0.12 40)"; ctx.fillRect(wx, base - HOLDS * step - 200, ww, HOLDS * step + 600);
        ctx.fillStyle = "oklch(0.48 0.12 35)"; for (let k = 0; k < 40; k++) ctx.fillRect(wx + ((k * 53) % ww), base - ((k * 97) % (HOLDS * step + 200)), 30, 8);
        const top = base - HOLDS * step; ctx.fillStyle = C.stamp; ctx.fillRect(W / 2 - 2, top - 70, 4, 60); ctx.beginPath(); ctx.moveTo(W / 2 + 2, top - 70); ctx.lineTo(W / 2 + 40, top - 58); ctx.lineTo(W / 2 + 2, top - 46); ctx.fill();
        txt("SWEET 30", W / 2, top - 84, 16, C.ink, "center", FD, 800);
        holds.forEach((h, i) => circ(wx + h.x * ww, base - i * step, 12, i <= lvl ? "oklch(0.75 0.16 85)" : "oklch(0.70 0.15 150)"));
        const hi = Math.floor(shown), fr = shown - hi, a = holds[hi], b = holds[Math.min(HOLDS, hi + 1)];
        const cx = wx + lerp(a.x, b.x, fr) * ww, cy = base - shown * step + 20;
        ell(cx, cy, 13, 18, "oklch(0.52 0.16 255)"); circ(cx, cy - 22, 9, "oklch(0.78 0.06 60)");
        ctx.strokeStyle = "oklch(0.78 0.06 60)"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx - 10, cy - 10); ctx.lineTo(cx - 16, cy - 30); ctx.moveTo(cx + 10, cy - 10); ctx.lineTo(cx + 16, cy - 30); ctx.stroke();
        ctx.restore();
        const bw = Math.min(W - 60, 460), bx = W / 2 - bw / 2, by = H - 80;
        rr(bx, by, bw, 26, 13); ctx.fillStyle = "oklch(0.25 0.03 255 / 0.85)"; ctx.fill();
        rr(bx + (zc - zw / 2) * bw, by, zw * bw, 26, 13); ctx.fillStyle = "oklch(0.70 0.17 150)"; ctx.fill();
        ctx.fillStyle = C.cream; ctx.fillRect(bx + p * bw - 3, by - 8, 6, 42);
        txt("Space / tap when the marker is in the green", W / 2, by - 18, 14, C.ink, "center", FM, 500);

      },

  // Cabo wedding buffet
  function makeFood() {
    const TYPES = [{ e: "🍕", v: 1 }, { e: "🍫", v: 2 }, { e: "🍣", v: 1 }, { e: "🌮", v: 1 }, { e: "🥦", v: -1 }];
    let t = 0, x = 0.5, score = 0, spawn = 0; const items = [], pops = [];
    const DUR = 25;
    return {
      update(dt) {
        t += dt; spawn -= dt;
        const dir = (down("arrowright", "d") ? 1 : 0) - (down("arrowleft", "a") ? 1 : 0);
        if (dir) x = clamp(x + dir * dt * 1.1, 0.05, 0.95);
        else if (mouse.down || T - mouse.moved < 0.05) x = lerp(x, clamp(mouse.x / W, 0.05, 0.95), 1 - Math.exp(-14 * dt));
        if (spawn <= 0 && t < DUR) { spawn = 0.42; const ty = TYPES[Math.floor(R() * (R() < 0.15 ? 5 : 4))]; items.push({ ...ty, x: 0.06 + R() * 0.88, y: -30, vy: 200 + R() * 160 }); }
        for (const it of items) it.y += it.vy * dt;
        const py = H - 110;

          const it = items[i];

      },

  // Costa Rica photo safari
  function makeSafari() {
    const TG = [{ e: "🐕", n: "Cally (hiding)", x: 0.18, y: 0.72 }, { e: "🐟", n: "Goldfish", x: 0.82, y: 0.80 }, { e: "🕷️", n: "Black widow", x: 0.66, y: 0.28 }, { e: "🦥", n: "Sloth", x: 0.36, y: 0.36 }, { e: "🦜", n: "Macaw", x: 0.52, y: 0.58 }];
    TG.forEach((g) => { g.snap = false; });
    const vf = { x: 0.5, y: 0.5 }; let t = 0, flash = 0, doneT = 0, missT = 0;
    const box = () => { const bw = Math.min(W - 24, 900), bh = Math.min(H - 220, 560); return { x: W / 2 - bw / 2, y: 92, w: bw, h: bh }; };
    const tpos = (g, b) => ({ x: b.x + (g.x + Math.sin(t * 0.7 + g.x * 9) * 0.02) * b.w, y: b.y + (g.y + Math.cos(t * 0.5 + g.y * 7) * 0.015) * b.h });
    function snap(b) {
      flash = 0.25; SFX.snap(); const cx = b.x + vf.x * b.w, cy = b.y + vf.y * b.h; let got = false;
      for (const g of TG) { if (g.snap) continue; const p = tpos(g, b); if (dist(cx, cy, p.x, p.y) < 60) { g.snap = true; got = true; gallery = [...new Set([...gallery, g.e])]; persist(); SFX.good(); toast(`Snapped: ${g.n}`, g.e); } }
      if (!got) missT = 0.8;
    }
    return {
      update(dt) {
        t += dt; flash = Math.max(0, flash - dt); missT = Math.max(0, missT - dt);
        const b = box();
        const mx = (down("arrowright", "d") ? 1 : 0) - (down("arrowleft", "a") ? 1 : 0), my = (down("arrowdown", "s") ? 1 : 0) - (down("arrowup", "w") ? 1 : 0);
        vf.x = clamp(vf.x + mx * dt * 0.5, 0, 1); vf.y = clamp(vf.y + my * dt * 0.6, 0, 1);
        if (T - mouse.moved < 0.05 && !isTouch && inRect(mouse, b)) { vf.x = (mouse.x - b.x) / b.w; vf.y = (mouse.y - b.y) / b.h; }
        if (doneT) { doneT += dt; if (doneT > 1.3) finish("safari", `${TG.filter((g) => g.snap).length}/5 photographed, gallery saved. Costa Rica looks good on you.`); return; }
        if (hit(" ", "enter")) snap(b);
        for (const c of usableClicks()) if (inRect(c, b)) { vf.x = (c.x - b.x) / b.w; vf.y = (c.y - b.y) / b.h; snap(b); }
        if (TG.every((g) => g.snap) || t > 60) doneT = 0.001;
      },
      draw() {
        ctx.fillStyle = "oklch(0.25 0.05 150)"; ctx.fillRect(0, 0, W, H);
        const b = box();
        ctx.save(); rr(b.x, b.y, b.w, b.h, 14); ctx.clip();
        const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h); g.addColorStop(0, "oklch(0.82 0.08 180)"); g.addColorStop(1, "oklch(0.55 0.13 150)"); ctx.fillStyle = g; ctx.fillRect(b.x, b.y, b.w, b.h);
        for (let k = 0; k < 3; k++) { ctx.fillStyle = ["oklch(0.62 0.12 160)", "oklch(0.52 0.14 155)", "oklch(0.44 0.13 150)"][k]; ctx.beginPath(); ctx.moveTo(b.x, b.y + b.h); for (let i = 0; i <= 12; i++) ctx.lineTo(b.x + (i / 12) * b.w, b.y + b.h * (0.45 + k * 0.12) + Math.sin(i * 1.7 + k) * 20); ctx.lineTo(b.x + b.w, b.y + b.h); ctx.fill(); }
        ell(b.x + b.w * 0.82, b.y + b.h * 0.84, b.w * 0.12, b.h * 0.06, "oklch(0.66 0.11 225)");
        ctx.fillStyle = "oklch(0.40 0.06 60)"; ctx.fillRect(b.x + b.w * 0.6, b.y + b.h * 0.3, b.w * 0.2, 8); ctx.fillRect(b.x + b.w * 0.25, b.y + b.h * 0.4, b.w * 0.22, 8);
        for (const t2 of TG) { const p = tpos(t2, b); emo(t2.e, p.x, p.y, 40); if (t2.snap) { circ(p.x + 22, p.y - 22, 10, C.stamp); } }
        for (let i = 0; i < 14; i++) { const lx = b.x + ((i * 0.137) % 1) * b.w, ly = b.y + ((i * 0.291 + 0.1) % 1) * b.h, sw = Math.sin(t * 1.3 + i) * 18; ctx.save(); ctx.translate(lx + sw, ly); ctx.rotate(i + Math.sin(t + i) * 0.2); ell(0, 0, 70, 26, i % 2 ? "oklch(0.42 0.14 150 / 0.92)" : "oklch(0.50 0.15 145 / 0.92)"); ctx.restore(); }
        // viewfinder
        const cx = b.x + vf.x * b.w, cy = b.y + vf.y * b.h, s = 70;
        ctx.fillStyle = "oklch(0.1 0.02 260 / 0.35)"; ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.rect(cx - s, cy - s, s * 2, s * 2); ctx.fill("evenodd");
        ctx.strokeStyle = C.white; ctx.lineWidth = 3; [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.moveTo(cx + dx * s, cy + dy * (s - 18)); ctx.lineTo(cx + dx * s, cy + dy * s); ctx.lineTo(cx + dx * (s - 18), cy + dy * s); ctx.stroke(); });
        ctx.beginPath(); ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy); ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8); ctx.stroke();
        circ(b.x + 20, b.y + 22, 6, `oklch(0.6 0.22 25 / ${0.5 + 0.5 * Math.sin(T * 5)})`); txt("REC", b.x + 32, b.y + 27, 14, C.white, "left", FM, 500);
        if (missT > 0) txt("nothing there, try again", cx, cy + s + 22, 14, C.white, "center", FM, 500);
        if (flash > 0) { ctx.fillStyle = `oklch(1 0 0 / ${flash * 3})`; ctx.fillRect(b.x, b.y, b.w, b.h); }
        ctx.restore();
        // gallery strip
        const gy = b.y + b.h + 18, slot = 54, gx = W / 2 - (TG.length * (slot + 8)) / 2;
        TG.forEach((t2, i) => { rr(gx + i * (slot + 8), gy, slot, slot, 8); ctx.fillStyle = t2.snap ? C.cream : "oklch(0.97 0.015 90 / 0.15)"; ctx.fill(); if (t2.snap) emo(t2.e, gx + i * (slot + 8) + slot / 2, gy + slot / 2, 28); });
        miniFrame("Photo Safari · Costa Rica", `Aim and snap: Space or click · ${TG.filter((x) => x.snap).length}/5`, true);
      },
    };
  }

    const wide = W >= 820;
    const k = wide ? Math.min(1, (W - 40) / 860, (H - 120) / 360) : Math.min(1, (W - 24) / 360, (H - 80) / 680);
    const tw = wide ? 860 : 360, th = wide ? 360 : 680;
    const slide = easeOut(clamp(endT / 0.8, 0, 1));
    ctx.save(); ctx.translate(W / 2, H / 2 + (1 - slide) * H * 0.6); ctx.scale(k, k); ctx.translate(-tw / 2, -th / 2); ctx.rotate(wide ? -0.015 : 0);
    rr(6, 10, tw, th, 22); ctx.fillStyle = "oklch(0.3 0.05 60 / 0.25)"; ctx.fill();
    rr(0, 0, tw, th, 22); ctx.fillStyle = C.white; ctx.fill();
    const mainW = wide ? 620 : tw, mainH = wide ? th : 500;
    rr(0, 0, wide ? mainW : tw, 64, [22, wide ? 0 : 22, 0, 0]); ctx.fillStyle = C.stamp; ctx.fill();
    txt("BOARDING PASS", 28, 41, 20, C.cream, "left", FD, 800); txt("FRIENDS MONTH AIRLINES", (wide ? mainW : tw) - 24, 40, 13, C.cream, "right", FM, 500);
    const photoS = wide ? 120 : 96;
    ctx.save(); rr(28, 88, photoS, photoS, 12); ctx.clip(); if (photoOk) ctx.drawImage(photo, 28, 88, photoS, photoS); else { ctx.fillStyle = C.lumon; ctx.fillRect(28, 88, photoS, photoS); } ctx.restore();
    const col2 = 28 + photoS + 24;

    txt("BOS", col2, 196, 42, C.ink, "left", FD, 800); txt("✈", col2 + 104, 190, 26, C.stamp, "left", FD, 800); txt("IND", col2 + 146, 196, 42, C.stamp, "left", FD, 800);
    const fields = [["DATE", "JAN 2027"], ["GATE", "J"], ["SEAT", "30A"], ["CLASS", "FRIEND"]];
    const fy = wide ? 250 : 236; const fw = ((wide ? mainW : tw) - 56) / 4;
    fields.forEach(([a, b], i) => { txt(a, 28 + i * fw, fy, 12, C.lumonInk, "left", FM, 500); txt(b, 28 + i * fw, fy + 28, 22, C.ink, "left", FD, 800); });
    wrap("Come to India in January. I'll handle the food. You handle the photos. Have fun, good luck, don't die. — Harsh", 28, fy + 70, (wide ? mainW : tw) - 56, 16, 22, C.ink, "left", FD, 600);
    // stub
    ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = "oklch(0.75 0.02 260)"; ctx.lineWidth = 2; ctx.beginPath();

    const by = wide ? th - 70 : th - 40;
    for (let i = 0; i < 46; i++) { const bw = (i * 5) % 3 + 1; ctx.fillStyle = C.ink; ctx.fillRect(sx + i * (wide ? 4.4 : 6.4), by, bw, 40); }
    if (wide) txt(`${secrets.size}/12 secrets · ${gallery.length} photos`, sx, by - 14, 12, C.lumonInk, "left", FM, 500);

  // ---------------------------------------------------------------- main loop
  function update(dt) {
    updateCommon(dt);
    if (hit("m") && mode !== "world") muted = !muted;
    if (mode === "world" || mode === "mini") { const mr = { x: W - 60, y: 64, w: 44, h: 32 }; if (mode === "world") for (const c of clicks) if (inRect(c, mr)) muted = !muted; }
    switch (mode) {

      case "lift": lift += dt; if (lift > 1.8) goWorld(); break;

      case "mini":
        if (hit("escape") || clicks.some((c) => inRect(c, exitRect()))) { exitMini(); break; }
        mini.update(dt); break;

      case "scare": scare.t += dt; if (scare.t > 1.5 && scare.t - dt <= 1.5) { SFX.scare(); shake = 16; } if (scare.t > 3.6) finish("forest", "Have fun. Good luck. Don't die. (You didn't. Cally might have.)"); break;
      case "ending": endT += dt; musicTick(true, 0.6); if (endT > 1.2 && (hit("enter", " ", "e") || clicks.length)) { mode = "world"; car.x = 3150; car.y = 1450; car.vx = car.vy = 0; } break;
    }

      case "lift": drawLift(); break;
      case "world": drawWorldScene(); drawHUD(); drawTouch(); break;
      case "mini": ctx.save(); ctx.translate((R() - 0.5) * shake * 0.5, 0); mini.draw(); ctx.restore(); break;
      case "card": drawCard(); break;
      case "scare": drawScare(); break;
      case "ending": drawEnding(); break;
    }
  }
  let last = performance.now(), raf = 0, alive = true;
  function frame(now) {

    const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
    try { update(dt); draw(); } catch (err) { console.warn(err); }
    pressed.clear(); clicks.length = 0;
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  // debug / test hook
  const api = {
    get mode() { return mode; },
    go(m, arg) {
      if (m === "office") startOffice();
      else if (m === "world") { firstWorld = false; goWorld(); revealT = 1; }
      else if (m === "mini") { const s = STOPS.find((x) => x.id === arg); mini = s.make(); mode = "mini"; }
      else if (m === "card") { card = { id: arg || "ski", detail: "14 of 16 gates in 31.2s. Vermont powder, conquered.", t: 1, first: true }; mode = "card"; }
      else if (m === "scare") { mode = "scare"; scare = { t: arg || 2 }; }
      else if (m === "ending") { mode = "ending"; endT = 2; }
      else if (m === "at") { goWorld(); revealT = 1; firstWorld = false; car.x = arg[0]; car.y = arg[1]; cam.x = car.x; cam.y = car.y; }
    },
    stampAll() { STOPS.forEach((s) => stamps.add(s.id)); },
  };
  window.__gylesWorld = api;

  return () => {
    alive = false; cancelAnimationFrame(raf); ro.disconnect();
    window.removeEventListener("keydown", kd); window.removeEventListener("keyup", ku); window.removeEventListener("blur", blur);
    canvas.removeEventListener("pointerdown", pd); canvas.removeEventListener("pointermove", pm); canvas.removeEventListener("pointerup", pu); canvas.removeEventListener("pointercancel", pu);
    if (ac) ac.close();
  };
}
